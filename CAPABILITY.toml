# CAPABILITY.toml — si-fleet-api
# Express REST API for the SuperInstance fleet

name = "si-fleet-api"
version = "1.0.0"
description = "REST API: fleet budgets, conservation audits, budget transfers, repo/capability queries, event logging, ecosystem health"

provides = [
    "health-endpoint",
    "repo-listing",
    "repo-search",
    "repo-detail",
    "capability-listing",
    "capability-resolution",
    "fleet-budget-query",
    "budget-transfer",
    "fleet-audit",
    "fleet-event-logging",
    "fleet-health-summary",
    "ecosystem-stats",
    "supabase-rest-client",
    "conservation-verification",
]

requires = [
    "supabase-instance",
    "fleet-budget-data",
    "fleet-events-table",
]
